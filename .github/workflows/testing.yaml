name: Testing

on:
  pull_request:
    branches:
    - master
  push:
    branches:
    - master

jobs:
  cargo-tests:
    name: Cargo Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Set up rust
      run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -y 
    - name: Run Tests
      run: cargo test
    - name: Check Formatting
      run: cargo fmt --check
